[project]
name = "senate"
version = "0.1.0"
description = "2026 Senate county-level projection pipeline"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2",
  "pyarrow>=16",
  "pydantic>=2.7",
  "pandera>=0.20",
  "pyyaml>=6",
  "requests>=2.32",
  "lxml>=5",
  "html5lib>=1.1",
  "structlog>=24",
  "pdfplumber>=0.11",
]

[project.optional-dependencies]
geo = ["geopandas>=1.0", "topojson>=1.9"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
